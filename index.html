<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1430" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kit Nugget" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Tafels oefenen met Kit Nugget" />
    <link rel="apple-touch-icon" href="./misc/apple-touch-icon.png" />
    <link rel="icon" href="./misc/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Kit Nugget Klimt</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Replaced as soon as the app mounts; keeps the first frame from being blank. -->
    <div id="splash">Kit Nugget<span>klimt...</span></div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #1b1430;
        color: #fdf4e3;
        font: 800 28px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
        z-index: 100;
      }
      #splash span {
        font-size: 14px;
        font-weight: 700;
        color: #ffd27d;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
